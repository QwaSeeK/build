# NapiLab family: NAPI-C and NAPI-Switch (RK3308), NAPI2 and NAPI-SMARC (RK3568).

case "${BOARD}" in
	napi2 | napi-smarc)
		# shellcheck source=config/sources/families/rk35xx.conf
		source "${BASH_SOURCE%/*}/rk35xx.conf"
		;;
	*)
		# shellcheck source=config/sources/families/include/rockchip64_common.inc
		source "${BASH_SOURCE%/*}/include/rockchip64_common.inc"
		prepare_boot_configuration
		;;
esac

function post_family_config__napilab_defaults() {
	declare -g TZDATA="Europe/Moscow"
	declare -g INSTALL_HEADERS="${INSTALL_HEADERS:-yes}"
	declare -g BOOTSCRIPT="napi-boot.cmd:boot.cmd"
	declare -g BOOTENV_FILE="napi.txt"

	case "${BOARD}" in
		napi2 | napi-smarc)
			declare -g OVERLAY_PREFIX="napi-rk3568"
			declare -g SERIALCON="ttyS2:1500000"
			;;
		*)
			declare -g BOOTDIR="u-boot-${BOARD}"
			declare -g SERIALCON="ttyS0:1500000"
			;;
	esac
}

# Applied over the upstream linux-rockchip64-*.config, so rebasing onto upstream never conflicts on it.
function custom_kernel_config__napilab_kernel_options() {
	opts_m+=("NET_DSA_MICROCHIP_KSZ_SPI")                         # KSZ9567S switch on NAPI-Switch, attached over SPI
	opts_y+=("WIZNET_W5100" "WIZNET_BUS_ANY" "WIZNET_W5100_SPI") # W5500 from the rk3308-spi1-w5500 overlay
}

function post_family_tweaks_bsp__napilab_bsp_cli_files() {
	[[ ! -d "${SRC}/packages/bsp/napi" ]] && return 0
	display_alert "${BOARD}" "adding NapiLab BSP files to armbian-bsp-cli" "info"
	run_host_command_logged cp -a "${SRC}/packages/bsp/napi/." "${destination}/"
	return 0
}

function post_family_tweaks_bsp__napic_udev_net_names() {
	[[ "${BOARD}" == "napic" ]] || return 0

	display_alert "$BOARD" "Installing udev net naming rules" "info"

	install -Dm644 "${SRC}/packages/bsp/napi/etc/udev/rules.d/99-napi-net-names.rules" \
		"${destination}/etc/udev/rules.d/99-napi-net-names.rules"
}

function post_family_tweaks__napilab_provision_accounts() {
	declare user_name="napi"
	declare user_pass="napilinux"
	declare group

	display_alert "${BOARD}" "creating user '${user_name}' at build time" "info"
	chroot_sdcard "useradd --create-home --shell /bin/bash --comment 'NAPI' '${user_name}'"
	chroot_sdcard "echo '${user_name}:${user_pass}' | chpasswd"

	for group in sudo netdev audio video disk tty users games dialout plugdev input \
		bluetooth systemd-journal ssh render docker; do
		chroot_sdcard "usermod -aG '${group}' '${user_name}' 2>/dev/null || true"
	done

	display_alert "${BOARD}" "disabling the first-login wizard, booting to a login prompt" "info"
	run_host_command_logged rm -fv "${SDCARD}/root/.not_logged_in_yet"
	return 0
}

function post_family_tweaks__napilab_motd_no_wan_lookup() {
	declare motd="${SDCARD}/etc/update-motd.d/10-armbian-header"
	[[ ! -f "${motd}" ]] && return 0
	if ! grep -q '^wan_ip_address=' "${motd}"; then
		display_alert "${BOARD}" "10-armbian-header changed upstream, WAN lookup not disabled" "wrn"
		return 0
	fi
	display_alert "${BOARD}" "disabling WAN IP lookup in MOTD" "info"
	sed -i -e 's|^wan_ip_address=.*|wan_ip_address=""|' \
		-e 's|^wan_ip6_address=.*|wan_ip6_address=""|' \
		-e 's|^if \[\[ "${ipv4s}" == \*${wan_ip_address}\* \]\]; then|if [[ -n "${wan_ip_address}" \&\& "${ipv4s}" == *${wan_ip_address}* ]]; then|' \
		"${motd}"
	return 0
}

function post_family_tweaks__napilab_prune_dtb() {
	declare d keep_dtb="${BOOT_FDT_FILE##*/}"
	[[ -z "${keep_dtb}" || -z "${OVERLAY_PREFIX}" ]] && return 0
	for d in "${SDCARD}"/boot/dtb-*; do
		[[ -d "${d}" ]] || continue
		display_alert "${BOARD}" "pruning DTBs in $(basename "${d}"), keeping ${keep_dtb}" "info"
		find "${d}" -mindepth 1 -maxdepth 1 -type d ! -name rockchip -exec rm -rf {} +
		find "${d}/rockchip" -maxdepth 1 -type f -name '*.dtb' ! -name "${keep_dtb}" -delete
		if [[ -d "${d}/rockchip/overlay" ]]; then
			find "${d}/rockchip/overlay" -maxdepth 1 -type f ! -name "${OVERLAY_PREFIX}-*" -delete
		fi
	done
	return 0
}

function post_repo_customize_image__napilab_packages() {
	if [[ -f "${SDCARD}/usr/share/keyrings/napilab.gpg" ]]; then
		display_alert "${BOARD}" "installing napilab packages: mbusd gpiod" "info"
		chroot_sdcard_apt_get_install mbusd gpiod
	fi

	if [[ "${BUILD_DESKTOP}" == "yes" ]] && [[ "${DISTRIBUTION}" == "Ubuntu" ]] &&
		compgen -G "${SDCARD}/etc/apt/sources.list.d/"*mozillateam* > /dev/null; then
		display_alert "${BOARD}" "installing browser: firefox (mozillateam PPA)" "info"
		chroot_sdcard_apt_get_install firefox
	fi
	return 0
}

####################
# TEST desktop images later for rk3568
####################
function post_family_tweaks__napilab_desktop_assets() {
	[[ "${BUILD_DESKTOP}" != "yes" ]] && return 0
	if [[ -d "${SRC}/packages/bsp/napi-desktop" ]]; then
		display_alert "${BOARD}" "installing NapiLab desktop assets" "info"
		# NOT `cp -a`: the build runs as root, so --preserve=ownership would stamp the
		# *build host user's* uid/gid (typically 1000, i.e. the future "napi" user) onto
		# /etc/apt/sources.list.d, /usr/share/keyrings, /usr/local/bin and /etc/skel --
		# and cp also rewrites the mode of pre-existing destination directories. Unlike
		# the bsp-cli copy, nothing chowns ${SDCARD} afterwards. tar keeps the symlinks
		# and the 0755 bits without touching ownership or existing directories.
		run_host_command_logged "tar -C '${SRC}/packages/bsp/napi-desktop' -cf - ." "|" \
			"tar -C '${SDCARD}' --no-same-owner --no-overwrite-dir -xf -"
	fi

	declare mozilla_src="${SDCARD}/etc/apt/sources.list.d/napi-mozillateam.sources"
	if [[ -f "${mozilla_src}" ]]; then
		if [[ "${DISTRIBUTION}" == "Ubuntu" ]]; then
			sed -i "s|^Suites:.*|Suites: ${RELEASE}|" "${mozilla_src}"
		else
			display_alert "${BOARD}" "not Ubuntu (${DISTRIBUTION}), dropping mozillateam PPA" "info"
			run_host_command_logged rm -f "${mozilla_src}" \
				"${SDCARD}/etc/apt/preferences.d/napi-browsers-no-snap" \
				"${SDCARD}/usr/share/keyrings/napi-mozillateam.gpg"
		fi
	fi

	declare greeter
	for greeter in "${SDCARD}/etc/lightdm/slick-greeter.conf" \
		"${SDCARD}/etc/armbian/lightdm/slick-greeter.conf"; do
		[[ -f "${greeter}" ]] || continue
		sed -i 's|^background *=.*|background = /usr/share/backgrounds/napi-wallpaper.jpg|' "${greeter}"
	done
	return 0
}

function image_specific_armbian_env_ready__napilab_boot_env() {
	declare env_file="${SDCARD}/boot/armbianEnv.txt"
	declare extraargs="${NAPI_EXTRAARGS:-}"

	[[ -z "${extraargs}" ]] && return 0
	display_alert "${BOARD}" "setting extraargs" "${extraargs}" "info"
	if grep -q '^extraargs=' "${env_file}"; then
		sed -i "s|^extraargs=.*|extraargs=${extraargs}|" "${env_file}"
	else
		echo "extraargs=${extraargs}" >> "${env_file}"
	fi
	return 0
}
