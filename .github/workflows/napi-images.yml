# Builds NAPI board images workflow
name: "NAPI images"
run-name: ${{ github.ref_type == 'tag' && github.ref_name || format('{0} {1}', inputs.release, inputs.variant) }}

on:
  workflow_dispatch:
    inputs:
      napi_c:
        description: "NAPI-C (RK3308)"
        type: boolean
        default: false
      napi2:
        description: "NAPI2 CLI (RK3568)"
        type: boolean
        default: false
      napi2_mate:
        description: "NAPI2 MATE desktop"
        type: boolean
        default: false
      napi2_gnome:
        description: "NAPI2 GNOME Classic desktop"
        type: boolean
        default: false
      napi_m:
        description: "NAPI-M (RK3562, vendor 6.1)"
        type: boolean
        default: false
      kernel_branch:
        description: "Kernel branch for RK3308/RK3568"
        type: choice
        options: [current, edge]
        default: current
      release:
        description: "Userspace release"
        type: choice
        options: [trixie, noble]
        default: trixie
      variant:
        description: "CLI image variant"
        type: choice
        options: [minimal, standard]
        default: minimal
      revision:
        description: "Image and package version (empty: use VERSION)"
        type: string
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  BRANCH: ${{ inputs.kernel_branch || 'current' }}

concurrency:
  group: napi-images-${{ github.ref_type == 'tag' && github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: "Prepare matrix and release"
    runs-on: self-hosted
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      tag: ${{ steps.matrix.outputs.tag }}
      revision: ${{ steps.matrix.outputs.revision }}
    steps:
      - name: Build matrix from the selected boards
        id: matrix
        env:
          SEL_NAPI_C: ${{ inputs.napi_c }}
          SEL_NAPI2: ${{ inputs.napi2 }}
          SEL_NAPI2_MATE: ${{ inputs.napi2_mate }}
          SEL_NAPI2_GNOME: ${{ inputs.napi2_gnome }}
          SEL_NAPI_M: ${{ inputs.napi_m }}
          CLI_VARIANT: ${{ inputs.variant || 'minimal' }}
          CLI_RELEASE: ${{ inputs.release || 'trixie' }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          # Map checkbox inputs to board configurations.
          declare -A selected=(
            [napi-c]="${SEL_NAPI_C}"
            [napi2]="${SEL_NAPI2}"
            [napi-m]="${SEL_NAPI_M}"
          )
          boards=()
          builds=()
          for board in napi-c napi2 napi-m; do
            if [[ "${GITHUB_EVENT_NAME}" == "push" || "${selected[${board}]}" == "true" ]]; then
              branch="${BRANCH}"
              [[ "${board}" == "napi-m" ]] && branch=vendor
              boards+=("${board}")
              if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
                builds+=("{\"board\":\"${board}\",\"branch\":\"${branch}\",\"release\":\"trixie\",\"variant\":\"minimal\"}")
                builds+=("{\"board\":\"${board}\",\"branch\":\"${branch}\",\"release\":\"noble\",\"variant\":\"standard\"}")
              else
                builds+=("{\"board\":\"${board}\",\"branch\":\"${branch}\",\"release\":\"${CLI_RELEASE}\",\"variant\":\"${CLI_VARIANT}\"}")
              fi
            fi
          done
          desktop_release="${CLI_RELEASE}"
          [[ "${GITHUB_EVENT_NAME}" == "push" ]] && desktop_release=noble
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${SEL_NAPI2_MATE}" == "true" ]]; then
            boards+=("napi2-mate")
            builds+=("{\"board\":\"napi2\",\"branch\":\"${BRANCH}\",\"release\":\"${desktop_release}\",\"variant\":\"mate\"}")
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${SEL_NAPI2_GNOME}" == "true" ]]; then
            boards+=("napi2-gnome-classic")
            builds+=("{\"board\":\"napi2\",\"branch\":\"${BRANCH}\",\"release\":\"${desktop_release}\",\"variant\":\"gnome\"}")
          fi
          if (( ${#builds[@]} == 0 )); then
            echo "::error::No image selected"
            exit 1
          fi

          revision="${INPUT_REVISION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            revision="${tag#v}"
          else
            tag="napi-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          fi
          if [[ -n "${revision}" && ! "${revision}" =~ ^[0-9][0-9A-Za-z.+:~-]*$ ]]; then
            echo "::error::Version must start with a digit and contain only Debian version characters"
            exit 1
          fi

          json=$(printf '%s,' "${builds[@]}")
          {
            echo "matrix={\"include\":[${json%,}]}"
            echo "tag=${tag}"
            echo "revision=${revision}"
            echo "images<<NAPI_IMAGES"
            printf '%s\n' "${builds[@]}" | jq -r '"| \(.board) | \(.release) | \(.variant) |"'
            echo "NAPI_IMAGES"
          } >> "${GITHUB_OUTPUT}"
          echo "Boards: ${boards[*]}; tag: ${tag}; revision: ${revision:-<revision from VERSION>}"

      - name: Create pre-release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.matrix.outputs.tag }}
          commit: ${{ github.sha }}
          name: "${{ steps.matrix.outputs.tag }}"
          body: |
            Kernel `${{ env.BRANCH }}` (NAPI-M: `vendor`).

            | Board | Release | Variant |
            |---|---|---|
            ${{ steps.matrix.outputs.images }}

            Commit ${{ github.sha }}, build ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ${{ github.ref_type == 'tag' && 'Stays a pre-release until every selected board has built.' || 'Manual build, stays a pre-release.' }}
          prerelease: true
          makeLatest: "false"
          allowUpdates: true

  build:
    name: "${{ matrix.board }} (${{ matrix.release }}, ${{ matrix.branch }}, ${{ matrix.variant }})"
    needs: prepare
    runs-on: self-hosted
    timeout-minutes: 500
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          clean: false
          persist-credentials: false

      - name: Build image
        env:
          BOARD: ${{ matrix.board }}
          BRANCH: ${{ matrix.branch }}
          RELEASE: ${{ matrix.release }}
          VARIANT: ${{ matrix.variant }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          set -euo pipefail
          minimal=no
          desktop=no
          [[ "${VARIANT}" == "minimal" ]] && minimal=yes
          args=()
          case "${VARIANT}" in
            mate|gnome)
              desktop=yes
              args+=("DESKTOP_ENVIRONMENT=${VARIANT}" "DESKTOP_TIER=mid")
              ;;
          esac
          [[ -n "${REVISION}" ]] && args+=("REVISION=${REVISION}")

          ./compile.sh build \
            BOARD="${BOARD}" BRANCH="${BRANCH}" RELEASE="${RELEASE}" \
            BUILD_MINIMAL="${minimal}" BUILD_DESKTOP="${desktop}" KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img,xz CLEAN_LEVEL=images \
            KERNEL_GIT=shallow "${args[@]}"

      - name: Summary
        env:
          BOARD: ${{ matrix.board }}
          RELEASE: ${{ matrix.release }}
          VARIANT: ${{ matrix.variant }}
        run: |
          shopt -s nullglob
          images=(output/images/*.img.xz)
          if (( ${#images[@]} == 0 )); then
            echo "::error::The build produced no .img.xz"
            exit 1
          fi
          {
            echo "### ${BOARD} (${RELEASE}, ${VARIANT})"
            echo "| Image | Size |"
            echo "|---|---|"
            for image in "${images[@]}"; do
              echo "| $(basename "${image}") | $(du -h "${image}" | cut -f1) |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "${TAG}" output/images/*.img.xz output/images/*.img.xz.sha --clobber --repo "${GITHUB_REPOSITORY}"

  finalize:
    name: "Publish release"
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success'
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Publish, keep as pre-release, or drop the empty release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          assets=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')
          if [[ "${BUILD_RESULT}" == "success" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # only tag builds become real releases; the pre-release notice goes away with them
            notes=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body | sed '/^Stays a pre-release/d')
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --prerelease=false --latest --notes "${notes}"
            echo "Published ${TAG} with ${assets} assets" >> "${GITHUB_STEP_SUMMARY}"
          elif [[ "${BUILD_RESULT}" == "success" ]]; then
            echo "Manual build ${TAG} stays a pre-release with ${assets} assets" >> "${GITHUB_STEP_SUMMARY}"
          elif (( assets == 0 )); then
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes
            else
              gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
            fi
            echo "::error::No board built; deleted the empty release ${TAG}"
            exit 1
          else
            echo "::warning::Some boards failed (build: ${BUILD_RESULT}); ${TAG} stays a pre-release with ${assets} assets"
          fi
