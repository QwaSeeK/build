# NAPI: IPv6 is not used on NAPI carriers; disable it globally.
# Ported verbatim from the old userpatches/overlay/etc/sysctl.d/100-disableip6.conf.
#
# The "100-" prefix is deliberate and must not be lowered: files in /etc/sysctl.d
# are applied in lexicographic order and Ubuntu ships /etc/sysctl.d/99-sysctl.conf
# (a symlink to /etc/sysctl.conf). Anything numbered below 99 could be overridden
# by a local edit of /etc/sysctl.conf; 100- always wins.

net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
