# NAPI: do not print /etc/issue before the login prompt on the virtual consoles.
#
# What mainline ships today: packages/bsp/common carries ONLY
#   lib/systemd/system/getty@tty1.service.d/10-noclear.conf -> [Service] TTYVTDisallocate=no
# There is no getty@.service.d drop-in in packages/bsp/common at all, so this
# file adds a new one and clobbers nothing.
#
# ExecStart is a list-valued directive, so it has to be cleared before it can be
# re-set. The command below is systemd's own getty@.service ExecStart with
# --noissue appended - keep it in sync if the distro unit ever changes.
# Type=idle is not repeated here; the stock unit already sets it.
#
# Interaction with root autologin: the build framework writes
# /etc/systemd/system/getty@.service.d/override.conf when CONSOLE_AUTOLOGIN=yes
# (lib/functions/rootfs/distro-agnostic.sh:82-93). systemd merges drop-ins by
# filename, and "override.conf" sorts after "20-napi-noissue.conf", so autologin
# still wins on the very first boot - which is what makes the unattended
# PRESET_* first-run work. armbian-firstlogin then deletes that override
# (packages/bsp/common/usr/lib/armbian/armbian-firstlogin:642-643) and this
# drop-in takes over: no autologin, no issue banner.

[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' --noclear --noissue - $TERM
