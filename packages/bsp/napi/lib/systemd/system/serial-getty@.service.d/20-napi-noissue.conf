# NAPI: do not print /etc/issue before the login prompt on the serial console.
#
# What mainline ships today: packages/bsp/common carries
#   lib/systemd/system/serial-getty@.service.d/10-term.conf -> [Service] Environment=TERM=linux
# This file is numbered 20- so both drop-ins apply; 10-term.conf sets a different
# directive and is not touched.
#
# ExecStart is a list-valued directive, so it has to be cleared before it can be
# re-set. The command below is systemd's own serial-getty@.service ExecStart with
# --noissue appended and 1500000 prepended to the BREAK baud-cycle list, because
# both NAPI boards run their console at 1500000 baud (napi-c: ttyS0, napi2: ttyS2).
# --keep-baud means the rate inherited from the kernel is used as-is; the list only
# matters when the user sends a BREAK.
# Type=idle is not repeated here; the stock unit already sets it.
#
# Interaction with root autologin: the build framework writes
# /etc/systemd/system/serial-getty@.service.d/override.conf when CONSOLE_AUTOLOGIN=yes
# (lib/functions/rootfs/distro-agnostic.sh:82-93). systemd merges drop-ins by
# filename, and "override.conf" sorts after "20-napi-noissue.conf", so autologin
# still wins on the very first boot - which is what makes the unattended
# PRESET_* first-run work. armbian-firstlogin then deletes that override
# (packages/bsp/common/usr/lib/armbian/armbian-firstlogin:642-643) and this
# drop-in takes over: no autologin, no issue banner.

[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' --keep-baud --noissue 1500000,115200,57600,38400,9600 - $TERM
